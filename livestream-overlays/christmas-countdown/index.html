<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">

    <!-- Embeddable replica of lovetosing.com/pages/christmas-countdown (Shopify blocks iframing). -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <title>Christmas Countdown — Love to Sing</title>

    <link rel="stylesheet" href="/assets/christmas-countdown.css">
  </head>
  <body class="cc-body">
    <div class="cc-stage" id="cc-stage" style="background-image: url('/media/christmas/background.jpg');">

      <video class="cc-bg-video" autoplay muted loop playsinline preload="auto" poster="/media/christmas/background.jpg" aria-hidden="true">
        <source src="/media/christmas/background-video.mp4" type="video/mp4">
      </video>

      <a class="cc-brand" href="https://lovetosing.com" target="_blank" rel="noopener" aria-label="Love to Sing">
        <img src="/media/christmas/logo.png" alt="Love to Sing" width="360" height="120">
      </a>

      <div class="cc-countdown" id="cc-countdown">
        <div class="cc-unit"><span class="cc-value" data-unit="days">--</span><span class="cc-label">Days</span></div>
        <span class="cc-sep">:</span>
        <div class="cc-unit"><span class="cc-value" data-unit="hours">--</span><span class="cc-label">Hours</span></div>
        <span class="cc-sep">:</span>
        <div class="cc-unit"><span class="cc-value" data-unit="minutes">--</span><span class="cc-label">Minutes</span></div>
        <span class="cc-sep">:</span>
        <div class="cc-unit"><span class="cc-value" data-unit="seconds">--</span><span class="cc-label">Seconds</span></div>
      </div>

      <div class="cc-message" id="cc-message">🎄Merry Christmas! 🎄</div>

      <div class="cc-player" id="cc-player">
        <img class="cc-art" alt="" src="" width="80" height="80">
        <div class="cc-meta">
          <span class="cc-title">—</span>
          <span class="cc-artist">—</span>
        </div>
        <div class="cc-controls">
          <button class="cc-btn-side cc-prev" aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button class="cc-btn-play" aria-label="Play">
            <svg class="cc-icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg class="cc-icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>
          <button class="cc-btn-side cc-next" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <script type="application/json" id="cc-config">
    {
      "referenceTz": "America/New_York",
      "targetMonth": 12,
      "targetDay": 25,
      "playlist": [
        { "title": "Jingle Bells Lofi", "artist": "Love to Sing", "art": "/media/christmas/artwork.jpg", "src": "/media/christmas/tracks/01-jingle-bells-lofi.mp3" },
        { "title": "Silent Night Lofi", "artist": "Love to Sing", "art": "/media/christmas/artwork.jpg", "src": "/media/christmas/tracks/05-silent-night-lofi.mp3" },
        { "title": "O Come All Ye Faithful Lofi", "artist": "Love to Sing", "art": "/media/christmas/artwork.jpg", "src": "/media/christmas/tracks/10-o-come-all-ye-faithful-lofi.mp3" },
        { "title": "Hark! The Herald Angel Sings Lofi", "artist": "Love to Sing", "art": "/media/christmas/artwork.jpg", "src": "/media/christmas/tracks/07-hark-the-herald-angels-sing-lofi.mp3" },
        { "title": "Deck the Halls Lofi", "artist": "Love to Sing", "art": "/media/christmas/artwork.jpg", "src": "/media/christmas/tracks/02-deck-the-halls-lofi.mp3" },
        { "title": "O Christmas Tree Lofi", "artist": "Love to Sing", "art": "/media/christmas/artwork.jpg", "src": "/media/christmas/tracks/08-o-christmas-tree-lofi.mp3" },
        { "title": "Angels We Have Heard on High", "artist": "Love to Sing", "art": "/media/christmas/artwork.jpg", "src": "/media/christmas/tracks/09-angels-we-have-heard-on-high-lofi.mp3" },
        { "title": "The First Noel Lofi", "artist": "Love to Sing", "art": "/media/christmas/artwork.jpg", "src": "/media/christmas/tracks/11-the-first-noel-lofi.mp3" },
        { "title": "12 Days of Christmas Lofi", "artist": "Love to Sing", "art": "/media/christmas/artwork.jpg", "src": "/media/christmas/tracks/04-12-days-of-christmas-lofi.mp3" },
        { "title": "We Wish You a Merry Christmas Lofi", "artist": "Love to Sing", "art": "/media/christmas/artwork.jpg", "src": "/media/christmas/tracks/03-we-wish-you-a-merry-christmas-lofi.mp3" },
        { "title": "Joy to the World Lofi", "artist": "Love to Sing", "art": "/media/christmas/artwork.jpg", "src": "/media/christmas/tracks/06-joy-to-the-world-lofi.mp3" }
      ]
    }
    </script>

    <script src="/assets/christmas-countdown.js" defer="defer"></script>
  </body>
</html>
